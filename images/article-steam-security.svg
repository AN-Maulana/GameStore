<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Cyber Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Hexagon Nodes -->
  <g opacity="0.3" fill="none" stroke="#60a5fa" stroke-width="2">
    <polygon points="160,100 190,117 190,152 160,170 130,152 130,117" />
    <polygon points="650,110 680,127 680,162 650,180 620,162 620,127" />
    <polygon points="680,310 710,327 710,362 680,380 650,362 650,327" />
    <polygon points="120,320 150,337 150,372 120,390 90,372 90,337" />
  </g>

  <!-- Glowing Outer Halo -->
  <circle cx="400" cy="225" r="140" fill="#2563eb" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Shield Circuit Lines -->
  <path d="M400 70 L530 130 L530 250 C530 330 400 380 400 380 C400 380 270 330 270 250 L270 130 Z" 
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="10 6" />

  <!-- Inner Solid Shield -->
  <path d="M400 95 L505 145 L505 240 C505 305 400 350 400 350 C400 350 295 305 295 240 L295 145 Z" 
        fill="url(#shieldGrad)" />

  <!-- Shield Highlights -->
  <path d="M400 105 L490 150 L490 235 C490 288 400 332 400 332 L400 105 Z" 
        fill="#ffffff" opacity="0.15" />

  <!-- Security Padlock Center -->
  <rect x="365" y="210" width="70" height="60" rx="10" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M377 210 V185 C377 172 387 162 400 162 C413 162 423 172 423 185 V210" 
        fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Keyhole -->
  <circle cx="400" cy="235" r="6" fill="#0f172a" />
  <polygon points="397,235 403,235 405,252 395,252" fill="#0f172a" />

  <!-- Steam 2FA Badge & Verification Dots -->
  <g transform="translate(400, 310)" text-anchor="middle">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">STEAM GUARD 2FA</text>
  </g>

  <!-- Floating Security Badges -->
  <g transform="translate(180, 210)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">✓ PROTECTED</text>
  </g>

  <g transform="translate(620, 210)">
    <rect x="-55" y="-18" width="110" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">API KEY SAFE</text>
  </g>
</svg>
