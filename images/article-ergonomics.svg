<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ergoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="50%" stop-color="#0d2822" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="ergoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ergoBg)" />

  <!-- Ambient Light Circle -->
  <circle cx="400" cy="225" r="160" fill="#10b981" opacity="0.12" filter="url(#ergoGlow)" />

  <!-- Heartbeat / Health Pulse Line -->
  <path d="M50 225 L220 225 L245 180 L265 270 L285 200 L305 245 L325 225 L475 225 L495 170 L515 280 L535 190 L555 250 L575 225 L750 225" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 4" />

  <!-- Desk and Screen Setup Silhouette -->
  <!-- Desk -->
  <rect x="180" y="320" width="440" height="14" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <rect x="230" y="334" width="16" height="80" fill="#0f172a" />
  <rect x="554" y="334" width="16" height="80" fill="#0f172a" />

  <!-- Monitor on Stand -->
  <rect x="240" y="160" width="180" height="110" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" />
  <rect x="250" y="170" width="160" height="90" rx="4" fill="#064e3b" opacity="0.7" />
  <rect x="325" y="270" width="10" height="50" fill="#334155" />
  <ellipse cx="330" cy="320" rx="25" ry="5" fill="#475569" />

  <!-- 90 Degree Angle Indicator on Monitor (Ergonomic Eye Level) -->
  <line x1="330" y1="210" x2="480" y2="210" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  <text x="400" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#facc15" font-weight="600">Mata Sejajar Layar</text>

  <!-- Ergonomic Gaming Chair -->
  <!-- Headrest -->
  <rect x="475" y="140" width="50" height="30" rx="8" fill="url(#chairGrad)" />
  <!-- Spine Support Backrest -->
  <path d="M485 175 C470 215 470 260 480 300 L520 300 C530 260 530 215 515 175 Z" fill="url(#chairGrad)" />
  <!-- Seat Cushion -->
  <rect x="460" y="300" width="80" height="24" rx="8" fill="#047857" stroke="#34d399" stroke-width="1" />
  <!-- Armrest -->
  <path d="M465 240 L495 240 L495 295" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />
  <!-- Gas Lift & Base -->
  <rect x="495" y="324" width="10" height="55" fill="#334155" />
  <polygon points="460,390 540,390 500,379" fill="#1e293b" />
  <circle cx="460" cy="392" r="5" fill="#475569" />
  <circle cx="540" cy="392" r="5" fill="#475569" />

  <!-- Posture Spine Curve Indicator -->
  <path d="M500 160 Q485 220 500 280" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#ergoGlow)" />

  <!-- Floating Health Metrics Cards -->
  <g transform="translate(140, 110)">
    <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">👁️ Aturan 20-20-20</text>
  </g>

  <g transform="translate(660, 110)">
    <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">⚡ Bebas Carpal Tunnel</text>
  </g>

  <!-- Top Title Pill -->
  <g transform="translate(400, 60)" text-anchor="middle">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#6ee7b7" letter-spacing="1.5">GAMER HEALTH &amp; ERGONOMICS</text>
  </g>
</svg>
